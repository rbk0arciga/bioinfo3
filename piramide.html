<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirámide 3D con Three.js</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            display: block;
        }

        /* 🔹 DIV CON LOS NOMBRES */
        #nombres {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #ffcc00;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.8),
                         0 0 20px rgba(255, 204, 0, 0.4);
            z-index: 10;
            pointer-events: none; /* Para que no bloquee clics en el canvas */
            user-select: none;
        }
    </style>

    <!-- Importmap para cargar Three.js desde CDN -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>
</head>
<body>

    <!-- 🔹 DIV CON LOS NOMBRES ARRIBA DE LA PIRÁMIDE -->
    <div id="nombres">RICARDO MELGOZA Y REBECA ARCIGA</div>

    <script type="module">
        // 1. IMPORTAR THREE.JS
        import * as THREE from 'three';

        // 2. CREAR ESCENA, CÁMARA Y RENDERIZADOR
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 6);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 3. CREAR UNA PIRÁMIDE
        const geometry = new THREE.ConeGeometry(1.2, 2, 4); // radio, altura, 4 lados

        const material = new THREE.MeshStandardMaterial({
            color: 0xffcc00,              // Amarillo dorado
            roughness: 0.3,
            metalness: 0.2,
            emissive: new THREE.Color(0x553300),
            side: THREE.DoubleSide
        });
        const pyramid = new THREE.Mesh(geometry, material);
        pyramid.rotation.y = Math.PI / 4; // Rotar para que las caras miren hacia la cámara
        scene.add(pyramid);

        // 4. AÑADIR BORDES A LA PIRÁMIDE
        const edges = new THREE.EdgesGeometry(geometry);
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff });
        const wireframe = new THREE.LineSegments(edges, lineMaterial);
        pyramid.add(wireframe);

        // 5. AÑADIR LUCES
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        const backLight = new THREE.DirectionalLight(0xffaa44, 0.5);
        backLight.position.set(-3, -2, -4);
        scene.add(backLight);

        // 6. AÑADIR UNA REJILLA
        const gridHelper = new THREE.GridHelper(10, 20, 0x4444ff, 0x222244);
        gridHelper.position.y = -1.5;
        scene.add(gridHelper);

        // 7. ANIMACIÓN
        function animate() {
            requestAnimationFrame(animate);

            // Rotar la pirámide
            pyramid.rotation.y += 0.01;
            // Efecto de "bote" leve
            pyramid.position.y = Math.sin(Date.now() * 0.002) * 0.2;

            renderer.render(scene, camera);
        }

        animate();

        // 8. MANEJAR REDIMENSIÓN DE VENTANA
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('✅ Pirámide funcionando correctamente');
    </script>

</body>
</html>
